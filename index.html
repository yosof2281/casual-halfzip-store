<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casual Half-Zip Set - متجر الملابس</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- الجزء الأيسر - اختيار الألوان -->
        <div class="color-selector">
            <h2>الألوان المتاحة</h2>
            <div class="color-grid">
                <div class="color-option" data-color="taupe" data-name="Taupe">
                    <div class="color-preview" style="background: linear-gradient(135deg, #9b8f78 0%, #7a6f5d 100%);"></div>
                    <span>Taupe</span>
                </div>
                <div class="color-option" data-color="black" data-name="Black">
                    <div class="color-preview" style="background: linear-gradient(135deg, #2a2a2a 0%, #000000 100%);"></div>
                    <span>Black</span>
                </div>
                <div class="color-option" data-color="navy" data-name="Navy">
                    <div class="color-preview" style="background: linear-gradient(135deg, #1e3a5f 0%, #0f1b2e 100%);"></div>
                    <span>Navy</span>
                </div>
                <div class="color-option" data-color="lightgray" data-name="Light Gray">
                    <div class="color-preview" style="background: linear-gradient(135deg, #e8e8e8 0%, #d0d0d0 100%);"></div>
                    <span>Light Gray</span>
                </div>
            </div>
        </div>

        <!-- الجزء الأيمن - عرض الملابس -->
        <div class="display-section">
            <!-- رأس القسم -->
            <div class="header">
                <h1>Casual Half-Zip Set</h1>
                <div class="view-toggles">
                    <button class="view-btn active" data-view="3d">3D View</button>
                    <button class="view-btn" data-view="details">Details</button>
                    <button class="view-btn" data-view="fabric">Fabric</button>
                </div>
            </div>

            <!-- منطقة العرض الرئيسية -->
            <div class="viewer-container">
                <!-- الخلفية الديناميكية -->
                <div class="dynamic-background" id="dynamicBg"></div>

                <!-- عارض الملابس -->
                <div class="product-viewer">
                    <div class="viewer-wrapper">
                        <div class="product-display" id="productDisplay">
                            <img class="outfit-image" id="outfitImage" src="images/taupe.png" alt="Taupe Outfit">
                        </div>
                    </div>

                    <!-- أزرار التحكم -->
                    <div class="control-buttons">
                        <button class="control-btn rotate-btn" title="تدوير">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 4v6h6M23 20v-6h-6"/>
                                <path d="M20.49 9A9 9 0 0 0 5.64 5.64"/>
                                <path d="M3.51 15A9 9 0 0 0 18.36 18.36"/>
                            </svg>
                            <span>Rotate</span>
                        </button>
                        <button class="control-btn zoom-btn" title="تكبير">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="11" cy="11" r="8"/>
                                <path d="m21 21-4.35-4.35"/>
                                <path d="M11 8v6M8 11h6"/>
                            </svg>
                            <span>Zoom</span>
                        </button>
                        <button class="control-btn move-btn" title="نقل">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M5 12h14M12 5v14"/>
                            </svg>
                            <span>Move</span>
                        </button>
                        <button class="control-btn fullscreen-btn" title="ملء الشاشة">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
                            </svg>
                            <span>Fullscreen</span>
                        </button>
                    </div>
                </div>

                <!-- أيقونات التحكم على اليمين -->
                <div class="side-controls">
                    <div class="control-icon rotate-control" title="دوّر">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M1 4v6h6M23 20v-6h-6"/>
                            <path d="M20.49 9A9 9 0 0 0 5.64 5.64"/>
                            <path d="M3.51 15A9 9 0 0 0 18.36 18.36"/>
                        </svg>
                        <p>Rotate</p>
                    </div>
                    <div class="control-icon zoom-control" title="كبّر">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"/>
                            <path d="m21 21-4.35-4.35"/>
                            <path d="M11 8v6M8 11h6"/>
                        </svg>
                        <p>Zoom</p>
                    </div>
                    <div class="control-icon move-control" title="حرّك">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M5 12h14M12 5v14"/>
                        </svg>
                        <p>Move</p>
                    </div>
                    <div class="control-icon fullscreen-control" title="ملء الشاشة">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
                        </svg>
                        <p>Fullscreen</p>
                    </div>
                </div>
            </div>

            <!-- أزرار 360 والتفاصيل -->
            <div class="bottom-tabs">
                <button class="tab-btn active" data-tab="360view">360° View</button>
                <button class="tab-btn" data-tab="details">Details</button>
                <button class="tab-btn" data-tab="fabric">Fabric</button>
            </div>
        </div>
    </div>

    <!-- أيقونات المشاركة والمفضلة -->
    <div class="top-right-actions">
        <button class="action-btn share-btn" title="شارك">
            <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.06c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/>
            </svg>
        </button>
        <button class="action-btn favorite-btn" title="أضف للمفضلة">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
            </svg>
        </button>
    </div>

    <script src="script.js"></script>
</body>
</html>
