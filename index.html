<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wave From</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-top:#eaf5fc;
    --bg-bottom:#cfe8f7;
    --ink:#12384f;
    --ink-soft:#3d6b85;
    --line:#9fd0ea;
    --card:#ffffff;
    --accent:#2f8fc4;
    --accent-deep:#1c5f85;
    --foam:#f5fbfe;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Tajawal','Poppins',sans-serif;
    background:
      radial-gradient(120% 90% at 50% -10%, var(--bg-top), var(--bg-bottom) 70%);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow-x:hidden;
    position:relative;
    padding:32px 16px;
  }

  .waves{
    position:fixed;
    left:0; right:0; bottom:0;
    width:100%;
    z-index:0;
    pointer-events:none;
  }

  .page{
    position:relative;
    z-index:1;
    width:100%;
    max-width:420px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }

  .brand{
    font-family:'Poppins',sans-serif;
    font-weight:700;
    font-size:2.6rem;
    letter-spacing:1px;
    color:var(--accent-deep);
    line-height:1;
    display:inline-flex;
    align-items:baseline;
    gap:6px;
    margin-bottom:6px;
  }
  .brand span.thin{ font-weight:300; color:var(--accent); }

  .tagline{
    font-size:0.95rem;
    color:var(--ink-soft);
    margin-bottom:38px;
    letter-spacing:0.3px;
  }

  .links{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .link-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:16px 20px;
    display:flex;
    align-items:center;
    gap:14px;
    text-decoration:none;
    color:var(--ink);
    transition:transform .18s ease, box-shadow .18s ease, background .18s ease;
    box-shadow:0 2px 10px rgba(47,143,196,0.08);
  }
  .link-card:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 22px rgba(47,143,196,0.18);
    background:var(--foam);
  }

  .icon{
    flex:0 0 42px;
    width:42px;
    height:42px;
    border-radius:12px;
    background:linear-gradient(160deg,var(--accent),var(--accent-deep));
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .icon svg{width:20px;height:20px;fill:#fff;}

  .link-text{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    text-align:right;
  }
  .link-label{
    font-size:0.78rem;
    color:var(--ink-soft);
  }
  .link-value{
    font-family:'Poppins',sans-serif;
    font-size:1rem;
    font-weight:500;
    color:var(--ink);
    direction:ltr;
  }

  footer{
    margin-top:44px;
    font-size:0.75rem;
    color:var(--ink-soft);
    opacity:0.75;
  }

  @media (max-width:380px){
    .brand{font-size:2.2rem;}
  }
</style>
</head>
<body>

<svg class="waves" viewBox="0 0 1440 220" preserveAspectRatio="none">

  </div>

</html>
